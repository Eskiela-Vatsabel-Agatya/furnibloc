    <path d="M 145 35 C 145 14, 160.5 -1.5, 182.5 -1.5 C 204.5 -1.5, 220 14, 220 35 C 220 56, 204.5 71.5, 182.5 71.5 C 160.5 71.5, 145 56, 145 35 Z M 162 35 C 162 47.5, 170.5 56.5, 182.5 56.5 C 194.5 56.5, 203 47.5, 203 35 C 203 22.5, 194.5 13.5, 182.5 13.5 C 170.5 13.5, 162 22.5, 162 35 Z" />
    <!-- C -->
    <path d="M 233 35 C 233 14, 248.5 -1.5, 270.5 -1.5 C 286 -1.5, 298.5 6, 304 18.5 L 289 25 C 285.5 17.5, 279 13.5, 270.5 13.5 C 258.5 13.5, 250 22.5, 250 35 C 250 47.5, 258.5 56.5, 270.5 56.5 C 279 56.5, 285.5 52.5, 289 45 L 304 51.5 C 298.5 64, 286 71.5, 270.5 71.5 C 248.5 71.5, 233 56, 233 35 Z" />
