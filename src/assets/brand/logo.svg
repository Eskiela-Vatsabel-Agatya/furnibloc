    <path d="M 136 0 H 151.5 V 64 H 136 Z M 156 0 H 169 C 183 0, 192 8.5, 192 20.5 C 192 29.5, 186.5 36.5, 177.5 39.2 L 194 64 H 176.5 L 161.5 40.5 H 156 V 28 H 167.5 C 173 28, 176.5 25, 176.5 20.5 C 176.5 16, 173 13, 167.5 13 H 156 Z" />
