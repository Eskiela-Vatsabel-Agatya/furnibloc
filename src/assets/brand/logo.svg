<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="100%" height="100%" role="img" aria-labelledby="furnibloc-logo-title">
  <title id="furnibloc-logo-title">FURNI BLOC — Furniture & Home Decoration</title>
  <defs>
    <style>
      .fb-ink { fill: var(--ink-900, #2F2E17); }
      .fb-ink-stroke { stroke: var(--ink-900, #2F2E17); fill: none; }
      .fb-brand { fill: var(--brand-500, #C4812F); }
      .fb-brand-stroke { stroke: var(--brand-500, #C4812F); fill: none; }
      .fb-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 500;
        font-size: 21.5px;
        letter-spacing: -0.01em;
      }
    </style>
  </defs>

  <!-- ==========================================
       LEFT ICON MARK: ARCH PILL + LAMP + CHAIR
       ========================================== -->
  <g id="icon-mark" transform="translate(8, 8)">
    <!-- Outer Rounded Pill Frame -->
    <rect class="fb-ink-stroke" x="6" y="6" width="124" height="182" rx="44" stroke-width="11" stroke-linejoin="round" />

    <!-- Hanging Pendant Lamp (Top Right) -->
    <!-- Lamp Cord -->
    <line class="fb-ink-stroke" x1="88" y1="10" x2="88" y2="55" stroke-width="6" stroke-linecap="round" />
    <!-- Lamp Dome Shade (Copper) -->
    <path class="fb-brand" d="M 65 81 C 65 62, 111 62, 111 81 Z" />
    <!-- Lamp Warm Bulb Glow (Olive Peek) -->
    <path class="fb-ink" d="M 80 83 A 8 6 0 0 0 96 83 Z" />

    <!-- Minimalist Armchair (Bottom Left) -->
    <!-- Upper Backrest Cushion (Copper) -->
    <path class="fb-brand" d="M 29 124 L 29 107 C 29 94, 40 88, 57 88 C 74 88, 85 94, 85 107 L 85 124 C 81 124, 78 127, 78 132 L 78 134 L 36 134 L 36 132 C 36 127, 33 124, 29 124 Z" />
    
    <!-- Armrests & Lower Frame (Dark Olive) -->
    <path class="fb-ink-stroke" d="M 22 128 C 29 128, 33 132, 33 139 L 33 147 L 81 147 L 81 139 C 81 132, 85 128, 92 128" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Seat Base Bar -->
    <path class="fb-ink-stroke" d="M 23 158 L 91 158" stroke-width="8" stroke-linecap="round" />
    <!-- Chair Legs -->
    <line class="fb-ink-stroke" x1="34" y1="158" x2="34" y2="171" stroke-width="7.5" stroke-linecap="round" />
    <line class="fb-ink-stroke" x1="80" y1="158" x2="80" y2="171" stroke-width="7.5" stroke-linecap="round" />
  </g>

  <!-- ==========================================
       RIGHT WORDMARK: FURNI / BLOC / SUBTITLE
       ========================================== -->
  <!-- LINE 1: "FURNI" (Pure Vector Paths in Dark Olive) -->
  <g id="wordmark-furni" class="fb-ink" transform="translate(166, 16)">
    <!-- F -->
    <path d="M 0 0 H 46 V 13.5 H 15.5 V 25 H 41 V 38 H 15.5 V 64 H 0 Z" />
    <!-- U -->
    <path d="M 60 0 H 75.5 V 38 C 75.5 46.5, 81 51, 89.5 51 C 98 51, 103.5 46.5, 103.5 38 V 0 H 119 V 38.5 C 119 55.5, 107 65, 89.5 65 C 72 65, 60 55.5, 60 38.5 Z" />
