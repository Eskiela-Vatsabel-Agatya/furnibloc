    <path d="M 0 0 H 36 C 50.5 0, 59.5 7.5, 59.5 18.5 C 59.5 25.5, 55.5 31, 49 33.5 C 57.5 36, 62.5 42.5, 62.5 51 C 62.5 63, 52.5 70, 36.5 70 H 0 Z M 16.5 13 V 28 H 33.5 C 40 28, 43.5 25, 43.5 20.5 C 43.5 16, 40 13, 33.5 13 Z M 16.5 41 V 57 H 35.5 C 42.5 57, 46.5 54, 46.5 49 C 46.5 44, 42.5 41, 35.5 41 Z" />
